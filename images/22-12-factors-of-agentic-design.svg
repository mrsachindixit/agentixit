<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 664" width="950" height="664"
     role="img" aria-labelledby="t d">
  <title id="t">The twelve factors, grouped in three layers, with their dependencies</title>
  <desc id="d">Twelve factors in three bands: foundation (F1 to F4), state and control (F5, F6, F8,
  F9) and integration and scale (F7, F10, F11, F12). Connectors show how they depend on each
  other: F1 produces F4, F2 shapes F3, F3 receives F9, F4 drives F5, F5 enables F6 and F12,
  F6 supports F7, F8 scopes F10, F10 exposes F11, F12 simplifies F6.</desc>
  <style>
    :root { --ink:#1f2937; --muted:#5b6b7f; --band:#f2f5f9; --rel:#7b8798; }
    .bt{font-size:13.5px;font-weight:750;fill:var(--ink);letter-spacing:.04em}
    .bs{font-size:11px;fill:var(--muted)}
    .fn{font-size:11.5px;font-weight:750;fill:#fff;opacity:.75}
    .ft{font-size:12.5px;font-weight:600;fill:#fff}
    .rel{stroke:var(--rel);stroke-width:1.5;fill:none}
    .rl{font-size:10px;fill:var(--rel)}
    .band{fill:var(--band)}
    text{font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  </style>
  <rect id="ground" x="0" y="0" width="950" height="664" fill="#ffffff"/>
  <defs>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5"
            orient="auto-start-reverse"><path d="M0 1L10 5L0 9z" fill="var(--rel)"/></marker>
  </defs>

  <!-- bands -->
  <rect class="band" x="14" y="20" width="922" height="132" rx="13"/>
  <rect class="band" x="14" y="250" width="922" height="132" rx="13"/>
  <rect class="band" x="14" y="480" width="922" height="132" rx="13"/>

  <text class="bt" x="30" y="62">FOUNDATION</text>
  <text class="bs" x="30" y="82">core LLM</text>
  <text class="bs" x="30" y="97">interaction</text>
  <text class="bt" x="30" y="286">STATE and</text>
  <text class="bt" x="30" y="303">CONTROL</text>
  <text class="bs" x="30" y="323">what it remembers</text>
  <text class="bs" x="30" y="338">and runs</text>
  <text class="bt" x="30" y="516">INTEGRATION</text>
  <text class="bt" x="30" y="533">and SCALE</text>
  <text class="bs" x="30" y="553">how it meets the</text>
  <text class="bs" x="30" y="568">rest of the system</text>

  <!-- row 1 : foundation -->
  <g fill="#3b82f6" stroke="#1e40af" stroke-width="2">
    <rect x="150" y="40" width="172" height="94" rx="11"/>
    <rect x="348" y="40" width="172" height="94" rx="11"/>
    <rect x="546" y="40" width="172" height="94" rx="11"/>
    <rect x="744" y="40" width="172" height="94" rx="11"/>
  </g>
  <text class="fn" x="164" y="62">F1</text>
  <text class="ft" x="164" y="88">Natural language</text>
  <text class="ft" x="164" y="106">to tool calls</text>
  <text class="fn" x="362" y="62">F2</text>
  <text class="ft" x="362" y="88">Own your</text>
  <text class="ft" x="362" y="106">prompts</text>
  <text class="fn" x="560" y="62">F3</text>
  <text class="ft" x="560" y="88">Own your</text>
  <text class="ft" x="560" y="106">context window</text>
  <text class="fn" x="758" y="62">F4</text>
  <text class="ft" x="758" y="88">Tools are just</text>
  <text class="ft" x="758" y="106">structured outputs</text>

  <!-- row 2 : state and control -->
  <g fill="#f59e0b" stroke="#b45309" stroke-width="2">
    <rect x="150" y="270" width="172" height="94" rx="11"/>
    <rect x="348" y="270" width="172" height="94" rx="11"/>
    <rect x="546" y="270" width="172" height="94" rx="11"/>
    <rect x="744" y="270" width="172" height="94" rx="11"/>
  </g>
  <text class="fn" x="164" y="292">F5</text>
  <text class="ft" x="164" y="318">Unify execution</text>
  <text class="ft" x="164" y="336">and business state</text>
  <text class="fn" x="362" y="292">F6</text>
  <text class="ft" x="362" y="318">Launch, pause,</text>
  <text class="ft" x="362" y="336">resume via APIs</text>
  <text class="fn" x="560" y="292">F8</text>
  <text class="ft" x="560" y="318">Own your</text>
  <text class="ft" x="560" y="336">control flow</text>
  <text class="fn" x="758" y="292">F9</text>
  <text class="ft" x="758" y="318">Compact errors</text>
  <text class="ft" x="758" y="336">into the context</text>

  <!-- row 3 : integration and scale -->
  <g fill="#10b981" stroke="#047857" stroke-width="2">
    <rect x="150" y="500" width="172" height="94" rx="11"/>
    <rect x="348" y="500" width="172" height="94" rx="11"/>
    <rect x="546" y="500" width="172" height="94" rx="11"/>
    <rect x="744" y="500" width="172" height="94" rx="11"/>
  </g>
  <text class="fn" x="164" y="522">F7</text>
  <text class="ft" x="164" y="548">Contact humans</text>
  <text class="ft" x="164" y="566">with tool calls</text>
  <text class="fn" x="362" y="522">F10</text>
  <text class="ft" x="362" y="548">Small, focused</text>
  <text class="ft" x="362" y="566">agents</text>
  <text class="fn" x="560" y="522">F11</text>
  <text class="ft" x="560" y="548">Trigger from</text>
  <text class="ft" x="560" y="566">anywhere</text>
  <text class="fn" x="758" y="522">F12</text>
  <text class="ft" x="758" y="548">Stateless</text>
  <text class="ft" x="758" y="566">reducer</text>

  <!-- dependencies, routed through the gutters -->
  <!-- F1 guided by F2 (dashed) -->
  <path class="rel" d="M 236 134 L 236 166 L 434 166 L 434 138" marker-end="url(#r)" stroke-dasharray="5 4"/>
  <text class="rl" x="335" y="161" text-anchor="middle">guided by</text>
  <!-- F2 shapes F3 -->
  <path class="rel" d="M 452 134 L 452 190 L 632 190 L 632 138" marker-end="url(#r)"/>
  <text class="rl" x="542" y="185" text-anchor="middle">shapes</text>
  <!-- F1 produces F4 -->
  <path class="rel" d="M 218 134 L 218 214 L 830 214 L 830 138" marker-end="url(#r)"/>
  <text class="rl" x="700" y="209" text-anchor="middle">produces</text>
  <!-- F3 receives F9 -->
  <path class="rel" d="M 650 134 L 650 238 L 848 238 L 848 266" marker-end="url(#r)"/>
  <text class="rl" x="749" y="233" text-anchor="middle">receives</text>
  <!-- F4 drives F5 -->
  <path class="rel" d="M 812 134 L 812 176 L 200 176 L 200 266" marker-end="url(#r)"/>
  <text class="rl" x="420" y="171" text-anchor="middle">drives</text>

  <!-- F5 enables F6 -->
  <path class="rel" d="M 236 364 L 236 396 L 434 396 L 434 368" marker-end="url(#r)"/>
  <text class="rl" x="335" y="391" text-anchor="middle">enables</text>
  <!-- F8 manages F9 (dashed) -->
  <path class="rel" d="M 650 364 L 650 420 L 830 420 L 830 368" marker-end="url(#r)" stroke-dasharray="5 4"/>
  <text class="rl" x="740" y="415" text-anchor="middle">manages</text>
  <!-- F6 supports F7 -->
  <path class="rel" d="M 398 364 L 398 444 L 200 444 L 200 496" marker-end="url(#r)"/>
  <text class="rl" x="299" y="439" text-anchor="middle">supports</text>
  <!-- F8 scopes F10 -->
  <path class="rel" d="M 596 364 L 596 468 L 398 468 L 398 496" marker-end="url(#r)"/>
  <text class="rl" x="497" y="463" text-anchor="middle">scopes</text>
  <!-- F5 enables F12 -->
  <path class="rel" d="M 272 364 L 272 424 L 866 424 L 866 496" marker-end="url(#r)"/>
  <text class="rl" x="560" y="419" text-anchor="middle">enables</text>
  <!-- F12 simplifies F6 -->
  <path class="rel" d="M 916 540 L 934 540 L 934 386 L 470 386 L 470 368" marker-end="url(#r)"/>
  <text class="rl" x="700" y="381" text-anchor="middle">simplifies</text>
  <!-- F10 exposes F11 -->
  <path class="rel" d="M 434 594 L 434 626 L 632 626 L 632 598" marker-end="url(#r)"/>
  <text class="rl" x="533" y="621" text-anchor="middle">exposes</text>
</svg>
