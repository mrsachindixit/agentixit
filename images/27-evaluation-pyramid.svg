<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 34 860 436" width="860" height="436"
     role="img" aria-labelledby="t d">
  <title id="t">The evaluation pyramid, five layers</title>
  <desc id="d">A pyramid of five bands, numbered from the wide base upward. Base: module-level
  tests with deterministic stubs. Then prompt regression, RAG retrieval quality, agent behaviour,
  and at the narrow apex, LLM-as-judge. The narrowing shape shows how the volume of tests falls
  as each layer gets less deterministic.</desc>

  <style>
    :root { --ink:#1f2937; --muted:#5b6b7f; --rule:#d7dee8; }
    .n    { font-size:13px; font-weight:700; fill:#fff; }
    .h    { font-size:17px; font-weight:650; fill:var(--ink); }
    .s    { font-size:13.5px; fill:var(--muted); }
    .rule { stroke:var(--rule); stroke-width:1.2; }
    text  { font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  </style>
  <rect id="ground" x="0" y="34" width="860" height="436" fill="#ffffff"/>

  <!-- bands, base upward -->
  <path d="M 92 450 L 348 450 L 316 372 L 124 372 Z" fill="#10b981" stroke="#047857" stroke-width="2"/>
  <text class="n" x="220" y="417" text-anchor="middle">1</text>

  <path d="M 124 366 L 316 366 L 284 288 L 156 288 Z" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text class="n" x="220" y="333" text-anchor="middle">2</text>

  <path d="M 156 282 L 284 282 L 252 204 L 188 204 Z" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
  <text class="n" x="220" y="249" text-anchor="middle">3</text>

  <path d="M 188 198 L 252 198 L 236 120 L 204 120 Z" fill="#8b5cf6" stroke="#6d28d9" stroke-width="2"/>
  <text class="n" x="220" y="165" text-anchor="middle">4</text>

  <path d="M 204 114 L 236 114 L 220 52 Z" fill="#ef4444" stroke="#b91c1c" stroke-width="2"/>
  <text class="n" x="220" y="106" text-anchor="middle" font-size="11">5</text>

  <!-- leaders meet each band's right edge at the label's height -->
  <line class="rule" x1="233" y1="88"  x2="396" y2="88"/>
  <text class="h" x="410" y="82">LLM-as-judge</text>
  <text class="s" x="410" y="103">a second LLM call with a grading prompt</text>

  <line class="rule" x1="248" y1="160" x2="396" y2="160"/>
  <text class="h" x="410" y="154">Agent behavior</text>
  <text class="s" x="410" y="175">canonical input, then verify JSON and tool-call sequence</text>

  <line class="rule" x1="272" y1="244" x2="396" y2="244"/>
  <text class="h" x="410" y="238">RAG retrieval quality</text>
  <text class="s" x="410" y="259">spot-check top-k against cosine-similarity thresholds</text>

  <line class="rule" x1="304" y1="328" x2="396" y2="328"/>
  <text class="h" x="410" y="322">Prompt regression</text>
  <text class="s" x="410" y="343">lock output structure, re-run on every model or prompt change</text>

  <line class="rule" x1="336" y1="412" x2="396" y2="412"/>
  <text class="h" x="410" y="406">Module-level</text>
  <text class="s" x="410" y="427">each module script, with deterministic stubs</text>
</svg>
