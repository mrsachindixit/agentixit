<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400"
     role="img" aria-labelledby="t d">
  <title id="t">The agent capability ladder, five rungs</title>
  <desc id="d">Five ascending steps: core reasoning with a bare LLM, connected with tools and
  retrieval, strategic with planning and memory, multi-agent coordination, and self-evolving
  which learns at runtime. Each rung sits higher than the last.</desc>
  <style>
    :root { --ink:#1f2937; --muted:#5b6b7f; --riser:#cbd5e1; }
    .n {font-size:19px;font-weight:700;fill:#0f172a;opacity:.45}
    .h {font-size:15.5px;font-weight:650;fill:#0f172a}
    .s {font-size:12.5px;fill:#0f172a;opacity:.72}
    .riser{stroke:var(--riser);stroke-width:2;stroke-dasharray:4 4}
    text{font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  </style>
  <rect id="ground" x="0" y="0" width="900" height="400" fill="#ffffff"/>

  <!-- risers, drawn behind the treads -->
  <g class="riser" fill="none">
    <path d="M 196 300 L 196 240"/><path d="M 352 240 L 352 180"/>
    <path d="M 508 180 L 508 120"/><path d="M 664 120 L 664 60"/>
  </g>

  <!-- rungs, low to high -->
  <g>
    <rect x="40" y="300" width="220" height="66" rx="12" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
    <text class="n" x="58" y="330">0</text>
    <text class="h" x="86" y="326">Core reasoning</text>
    <text class="s" x="86" y="346">bare LLM</text>
  </g>
  <g>
    <rect x="196" y="240" width="220" height="66" rx="12" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
    <text class="n" x="214" y="270">1</text>
    <text class="h" x="242" y="266">Connected</text>
    <text class="s" x="242" y="286">tools + retrieval</text>
  </g>
  <g>
    <rect x="352" y="180" width="220" height="66" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
    <text class="n" x="370" y="210">2</text>
    <text class="h" x="398" y="206">Strategic</text>
    <text class="s" x="398" y="226">planning + memory</text>
  </g>
  <g>
    <rect x="508" y="120" width="220" height="66" rx="12" fill="#fce7f3" stroke="#be185d" stroke-width="2"/>
    <text class="n" x="526" y="150">3</text>
    <text class="h" x="554" y="146">Multi-agent</text>
    <text class="s" x="554" y="166">coordination</text>
  </g>
  <g>
    <rect x="664" y="60" width="220" height="66" rx="12" fill="#d1fae5" stroke="#047857" stroke-width="2"/>
    <text class="n" x="682" y="90">4</text>
    <text class="h" x="710" y="86">Self-evolving</text>
    <text class="s" x="710" y="106">learns at runtime</text>
  </g>
</svg>
